<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PERFMASTER</title>
<link rel="icon" type="image/png" sizes="512x512" href="./perfmaster-icon.png">
<meta name="theme-color" content="#0a0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PERFMASTER">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./perfmaster-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0e17;--cd:#121824;--ch:#1a2334;--bd:#202b3d;--g:#10b981;--b:#3b82f6;--pu:#8b5cf6;--o:#f59e0b;--r:#ef4444;--cy:#06b6d4;--t:#f3f4f6;--m:#9ca3af;--d:#6b7280}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,-apple-system,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--t);min-height:100vh;display:flex;justify-content:center;padding:1rem;padding-top:calc(1rem + env(safe-area-inset-top,0px));padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px));background-image:radial-gradient(circle at 10% 20%,rgba(59,130,246,.07),transparent 25%),radial-gradient(circle at 90% 80%,rgba(16,185,129,.07),transparent 25%)}
.app{width:100%;max-width:480px;background:#0f1522;border:1px solid var(--bd);border-radius:28px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,.7);align-self:flex-start}
.hdr{padding:1.1rem 1.4rem .9rem;background:rgba(18,24,36,.95);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem}
.brand-logo{width:30px;height:30px;object-fit:contain;vertical-align:middle;margin-right:.35rem;filter:drop-shadow(0 0 5px rgba(16,255,80,.15))}.brand{font-size:1.25rem;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#10b981,#3b82f6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.badge{font-size:.62rem;font-weight:700;padding:.2rem .5rem;border-radius:12px;background:rgba(16,185,129,.15);color:var(--g);border:1px solid rgba(16,185,129,.3);text-transform:uppercase;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.dates{display:flex;background:var(--bg);padding:.35rem;border-radius:16px;border:1px solid var(--bd)}
.dbtn{flex:1;background:0;border:0;color:var(--m);padding:.5rem;border-radius:12px;font-size:.8rem;font-weight:600;cursor:pointer;transition:.25s}
.dbtn.on{background:var(--b);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.35)}#dlab{flex:4;background:var(--b);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.35);text-transform:capitalize}#dprev,#dnext{flex:0 0 46px;font-size:1.3rem;color:var(--t)}
.dash{padding:1.1rem 1.4rem;background:var(--cd);border-bottom:1px solid var(--bd)}
.dt{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--d);font-weight:700;margin-bottom:.7rem;display:flex;justify-content:space-between}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem}
.mp{background:rgba(10,14,23,.6);border:1px solid var(--bd);border-radius:14px;padding:.55rem .3rem;text-align:center}
.mv{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:.82rem}
.ml{font-size:.62rem;color:var(--m);margin:.15rem 0 .35rem}
.pb{height:4px;background:var(--bd);border-radius:4px;overflow:hidden}.pb i{display:block;height:100%;width:0;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.cfg{padding:1.1rem 1.4rem;border-bottom:1px solid var(--bd);background:var(--bg)}
.sh{font-size:.85rem;font-weight:700;margin-bottom:.8rem}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:.65rem}.f{display:flex;flex-direction:column;gap:.25rem}.f.full{grid-column:span 2}
label{font-size:.68rem;color:var(--m);font-weight:600}
input,select{background:var(--cd);border:1px solid var(--bd);color:var(--t);padding:.6rem .7rem;border-radius:12px;font-size:.85rem;outline:0;transition:border-color .2s;width:100%}
input:focus,select:focus{border-color:var(--b)}
.mode{display:flex;background:var(--cd);padding:.25rem;border-radius:14px;border:1px solid var(--bd);margin-top:.7rem}
.mb{flex:1;padding:.5rem .1rem;border:0;background:0;color:var(--m);font-size:.6rem;font-weight:700;border-radius:10px;cursor:pointer;transition:.25s}
.mb.on{background:var(--pu);color:#fff;box-shadow:0 2px 8px rgba(139,92,246,.4)}
.og{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.7rem}
.cc{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:.55rem .7rem;display:flex;align-items:center;gap:.5rem;cursor:pointer;user-select:none;transition:.25s}
.cc.on{border-color:var(--g);background:rgba(16,185,129,.1);transform:scale(1.02)}
.cc input{accent-color:var(--g);width:14px;height:14px;padding:0}.cc span{font-size:.74rem;font-weight:600;color:var(--t)}
.tip{margin-top:.7rem;font-size:.72rem;color:#c4b5fd;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);border-radius:12px;padding:.6rem .75rem;line-height:1.4}
.tl{padding:1.2rem 1.4rem}
.ti{position:relative;padding-left:1.4rem;margin-bottom:1.1rem;border-left:2px solid var(--bd);opacity:0;animation:up .5s forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ti.ride{border-left-color:var(--cy)}.ti.done{border-left-color:var(--g)}.ti.past{opacity:.55!important}
.dot{position:absolute;left:-6px;top:0;width:10px;height:10px;border-radius:50%;background:var(--bd)}
.ti.ride .dot{background:var(--cy);box-shadow:0 0 10px var(--cy)}.ti.done .dot{background:var(--g);box-shadow:0 0 10px var(--g)}
.ti.next .dot{background:var(--o);animation:pulse 1.6s infinite}
.tlb{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--d);font-weight:600;margin-bottom:.3rem;display:flex;gap:.5rem;align-items:center}
.nx{color:var(--o);font-size:.62rem;font-family:Inter}
.card{border-radius:16px;padding:.9rem 1rem;cursor:pointer;transition:transform .2s,filter .2s;border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px) scale(1.01);filter:brightness(1.1)}.card:active{transform:scale(.98)}
.c-t{background:linear-gradient(135deg,#0d9488,#064e3b)}.c-o{background:linear-gradient(135deg,#f59e0b,#92400e)}.c-r{background:linear-gradient(135deg,#e11d48,#7f1d3b)}
.c-w{background:linear-gradient(135deg,rgba(6,182,212,.18),rgba(59,130,246,.1));border-color:rgba(6,182,212,.4)}
.c-p{background:var(--cd)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.45rem}
.cn{font-size:.92rem;font-weight:700}.ck{font-size:.7rem;font-family:'JetBrains Mono',monospace;opacity:.9}
.tg{display:flex;gap:.35rem;flex-wrap:wrap;font-size:.7rem;font-family:'JetBrains Mono',monospace}
.tg span{padding:.15rem .4rem;border-radius:6px;background:rgba(0,0,0,.3)}
.ex{font-size:.74rem;opacity:.85;margin-top:.5rem;line-height:1.35}
.chk{position:absolute;top:.6rem;right:.8rem;font-size:1rem;animation:pop .4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.rate{font-size:1.6rem;font-weight:800;color:var(--cy);font-family:'JetBrains Mono',monospace}
.bdg{font-size:.62rem;background:rgba(0,0,0,.3);padding:.1rem .4rem;border-radius:8px;margin-left:.3rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:50;display:flex;justify-content:center;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;background:var(--cd);border-radius:28px 28px 0 0;border:1px solid var(--bd);padding:1.3rem 1.3rem calc(1.3rem + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto}
.ov.on .sheet{transform:none}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}.mt{font-size:1.05rem;font-weight:800}
.x{background:rgba(255,255,255,.1);border:0;color:var(--t);width:32px;height:32px;border-radius:50%;cursor:pointer;font-weight:700}
.opt{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:.9rem;margin:.8rem 0;transition:.2s}.opt:hover{border-color:var(--g)}
.ot{font-size:.85rem;font-weight:700;color:var(--g);margin-bottom:.4rem}
.it{font-size:.8rem;color:var(--m);line-height:1.6}.it b{color:var(--t)}
.btn{width:100%;padding:.65rem;background:var(--g);border:0;border-radius:10px;color:#000;font-weight:700;font-size:.8rem;cursor:pointer;margin-top:.6rem;transition:.2s}.btn:active{transform:scale(.97)}
.btn.b{background:var(--b);color:#fff}
.sb{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);border-radius:12px;padding:.7rem;margin:.5rem 0;font-size:.76rem;color:#c4b5fd;line-height:1.45}
.lg{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;padding:.4rem 0;border-bottom:1px solid var(--bd);color:var(--m)}
.lg button{background:0;border:0;color:var(--r);cursor:pointer;font-size:.9rem}
.row{display:flex;gap:.5rem;margin-top:.4rem}.row input:first-child{flex:2}
.food-search-row{display:flex;gap:.45rem;align-items:center;margin:.45rem 0}.food-search-row input{min-width:0;flex:1}.scan-btn{flex:0 0 48px;width:48px;height:44px;border:1px solid var(--bd);border-radius:12px;background:var(--ch);color:var(--t);font-size:1.2rem;cursor:pointer}.food-result{display:flex;flex-direction:column;gap:.2rem;width:100%;text-align:left;padding:.7rem .75rem;margin:.35rem 0;background:var(--bg);border:1px solid var(--bd);border-radius:12px;color:var(--t);cursor:pointer}.food-result.selected{border-color:var(--g);background:rgba(16,185,129,.1)}.food-result small{color:var(--m);font-size:.68rem}.food-status{font-size:.72rem;color:var(--m);padding:.35rem 0;line-height:1.4}.food-add-row{display:flex;gap:.5rem;align-items:end}.food-add-row .f{flex:1}.macro-alert{color:var(--o);font-size:.72rem;margin-top:.35rem}.meal-total{border:1px solid var(--bd);background:rgba(6,182,212,.07);border-radius:12px;padding:.7rem;margin:.6rem 0}.meal-total .tg{margin-top:.35rem}.scanner-video{width:100%;border-radius:14px;background:#000;max-height:48vh;object-fit:cover}.scan-frame{border:2px solid var(--g);border-radius:18px;height:160px;position:absolute;left:15%;right:15%;top:50%;transform:translateY(-50%);pointer-events:none}.scan-stage{position:relative;margin:.6rem 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--g);color:#000;font-weight:700;font-size:.8rem;padding:.6rem 1rem;border-radius:20px;opacity:0;transition:.35s;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
.meal-add-fab{position:fixed;right:max(18px,calc((100vw - 480px)/2 + 18px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:29;width:54px;height:54px;border:0;border-radius:50%;background:var(--g);color:#06251a;font-size:2rem;font-weight:800;box-shadow:0 5px 18px #0008;cursor:pointer}
.hd{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--d);font-weight:700;margin:1rem 0 .2rem}
.app{margin-bottom:120px}.view{display:none}.view.on{display:block;animation:up .4s}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:space-around;align-items:flex-end;padding:.5rem 1rem calc(.6rem + env(safe-area-inset-bottom,0px));background:rgba(18,24,36,.96);backdrop-filter:blur(12px);border-top:1px solid var(--bd);border-radius:24px 24px 0 0;z-index:30}
.nb{background:0;border:0;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:.65rem;font-weight:600;cursor:pointer;width:64px;font-size:.58rem;transition:.25s}
.nb .ic{font-size:1.4rem}.nb.on{color:var(--b)}.nb:active .ic{transform:scale(.9)}
.nb.home{margin-top:-34px}.nb.home .ic{width:66px;height:66px;border-radius:50%;border:3px solid var(--b);background:#16233b;display:flex;align-items:center;justify-content:center;font-size:1.9rem;box-shadow:0 6px 20px rgba(59,130,246,.45),0 0 0 5px #0f1522;transition:.3s}
.nb.home.on .ic{background:var(--b);transform:scale(1.08)}
.hm{padding:1.3rem 1.4rem}.dtl{font-size:1.35rem;font-weight:800;text-transform:capitalize;margin-bottom:1rem}
.sec{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--d);font-weight:700;margin:1.1rem 0 .5rem}
.big{font-size:1.1rem;font-weight:800;margin-bottom:.3rem}.cd{font-size:.72rem;color:#fde68a;font-weight:700;margin-top:.5rem}
.en{padding:1.1rem 1.4rem;background:var(--cd);border-bottom:1px solid var(--bd)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;text-align:center;font-size:.8rem}.dh{font-size:.65rem;color:var(--d)}
.cl{padding:.45rem 0;border-radius:10px;cursor:pointer;background:var(--cd);transition:.2s}.cl i{display:block;width:6px;height:6px;border-radius:50%;margin:.15rem auto 0}.cl.sel{background:var(--b)}.cl.td{outline:1px solid var(--o)}
.cmh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;font-weight:800;text-transform:capitalize}.cmh button{background:var(--cd);border:1px solid var(--bd);color:var(--t);border-radius:10px;width:34px;height:34px;cursor:pointer}
.wr{display:grid;grid-template-columns:38px 56px 1fr 84px;gap:.5rem;align-items:center;font-size:.72rem;margin:.5rem 0}.wr small{color:var(--m);font-size:.64rem}
.st{margin-bottom:.7rem}.nx3{display:flex;gap:.4rem;overflow-x:auto;margin-top:.6rem}.nx3 span{flex:0 0 auto;font-size:.62rem;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:.25rem .5rem;white-space:nowrap;color:var(--m)}.ob{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--m);border-radius:8px;padding:.4rem 0;font-weight:700;font-size:.78rem;cursor:pointer}.ob.on{background:var(--c);color:#000;border-color:var(--c)}.auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:1.5rem}.auth.on{display:flex}.st.ok{opacity:.5;border-color:var(--g)}.st.ok .cn::after{content:' ✅'}

/* Ajustements de robustesse mobile */
*,*::before,*::after{box-sizing:border-box}
img{max-width:100%}
.sheet{max-width:100vw}
.opt,.card,.meal-total{overflow-wrap:anywhere}
@media(max-width:380px){.hm{padding:1rem .8rem}.mg{grid-template-columns:repeat(2,minmax(0,1fr))}.nb{width:55px}.sheet{padding:1rem}.ch{align-items:flex-start}}
.view,.hm,.card,.opt,.f,.sec,.cn,.ck,.ex,.tg,.row,.ch,.btn,.x,.cc{min-width:0;overflow-wrap:anywhere;word-break:normal}
.btn{white-space:normal;max-width:100%;line-height:1.35}
.row{flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.ch{flex-wrap:wrap;gap:.4rem}
.ch>.cn{flex:1 1 150px}
input,select,textarea{max-width:100%;min-width:0}
.fg{min-width:0}
.cc span{overflow-wrap:anywhere}

</style><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0e17">
</head><body>
<div class="app">
<div class="hdr"><div class="bar"><div class="brand"><img class="brand-logo" src="./perfmaster-logo.png" alt="" aria-hidden="true"> PERFMASTER</div></div>
<div class="dates" id="dates"><button class="dbtn" id="dprev">‹</button><button class="dbtn on" id="dlab"></button><button class="dbtn" id="dnext">›</button></div><div id="nx3" class="nx3"></div></div>
<div class="view on" id="v-home"></div><div class="view" id="v-recup"></div><div class="view" id="v-course"></div><div class="view" id="v-cal"></div><div class="view" id="v-board"><div class="dash"><div class="dt"><span>Objectifs nutritifs du jour</span><span id="tk" style="color:var(--g)">0 / 0 kcal</span></div>
<div class="mg" id="mg"></div></div><div class="en" id="en"></div><div class="en" id="pmc"></div><div class="tl" id="tl"></div></div><div class="view" id="v-train"><div style="padding:1rem 1.4rem 0"><button class="btn b" style="margin:0" onclick="saveTrainingAndReturn()">✓ Sauvegarder l’entraînement</button></div>
<div class="cfg"><div class="sh" id="sessionTitle">⚙️ Planification de la séance</div>
<div class="fg">
<div class="f"><label>Jour</label><input type="date" id="day"></div>
<div class="f"><label>Poids (kg)</label><input type="number" id="kg" value="72" min="40" max="120"></div>
<div class="f" id="wakeField" style="display:none"><label>Réveil habituel</label><input type="time" id="wake" value="07:30"></div>
<div class="f"><label>Heure de départ</label><input type="time" id="ride" value="09:30"></div>
<div class="f"><label>Sport</label><select id="sport"><option value="bike">Vélo</option><option value="run">Course à pied</option><option value="strength">Musculation</option><option value="swim">Natation</option><option value="ski">Ski de fond</option></select></div>
<div class="f"><label>Durée (heures, précision 0,05 h ≈ 3 min)</label><input type="number" id="dur" value="2" min="0" max="24" step="0.05"></div>
<div class="f" id="strengthIntensityWrap" style="display:none"><label>Intensité musculation</label><select id="strengthIntensity"><option value="light">Légère · technique / repos longs</option><option value="moderate" selected>Modérée · séries classiques</option><option value="hard">Élevée · séries exigeantes / repos courts</option></select></div>
<div class="f" id="enduranceIntensityWrap" style="display:none"><label>Intensité natation / ski de fond</label><select id="enduranceIntensity"><option value="easy">Facile · récupération / technique</option><option value="moderate" selected>Modérée · endurance régulière</option><option value="hard">Élevée · soutenue / intervalles</option></select></div>
<div class="f" id="skiPaceWrap" style="display:none"><label>Allure ski de fond (min/km)</label><input type="text" id="skiPace" value="6:00" placeholder="6:00"></div>
<div class="f" id="swimPaceWrap" style="display:none"><label>Allure natation (min/100 m)</label><input type="text" id="swimPace" value="2:00" placeholder="2:00"></div>
<div class="f" id="wattsWrap"><label>Puissance cible (W)</label><input type="number" id="watts" value="205" min="0" step="1"></div><div class="f" id="ftpWrap"><label>FTP (W)</label><input type="number" id="ftp" value="280" min="1"></div><div class="f" id="paceWrap"><label>Allure course (min/km)</label><input type="text" id="pace" value="5:30" placeholder="5:30"></div>
<div class="f full"><label>Glucides intra · plafond personnel entraîné</label><select id="intraCeiling" onchange="CFG.intraCeiling=Number(this.value);save();render()"><option value="60">Jusqu’à 60 g/h · tolérance en développement</option><option value="90" selected>Jusqu’à 90 g/h · intestin entraîné</option><option value="100">Jusqu’à 100 g/h · entraînement digestif avancé</option><option value="120">Jusqu’à 120 g/h · uniquement si validé progressivement</option></select></div>
<div class="f full"><label>Spécificité 1 (vélo/course)</label><select id="s1"><option value="none">Aucune (endurance)</option><option value="vo2">VO2 max / intervalles</option><option value="tempo">Tempo / seuil</option><option value="sprint">Sprints / explosivité</option></select></div>
<div class="f full"><label>Spécificité 2 (optionnelle)</label><select id="s2"><option value="none">Aucune</option><option value="tempo">Tempo / seuil</option><option value="sprint">Sprints</option><option value="vo2">VO2 max</option></select></div>
</div>
<button class="btn" style="margin:.5rem 0" onclick="mealPrefsUI(false)">🍽️ Préférences alimentaires et repas</button>
<div class="mode"><button class="mb on" data-m="normal">NORMAL</button><button class="mb" data-m="affutage">AFFÛTAGE</button><button class="mb" data-m="performance">PERFORMANCE</button><button class="mb" data-m="masse">MASSE</button></div>
<div class="og">
<label class="cc" data-k="caf"><input type="checkbox" id="caf"><span>☕ Caféine</span></label>
<label class="cc" data-k="bet"><input type="checkbox" id="bet"><span>🧃 Betteraves</span></label>
<label class="cc" data-k="hot"><input type="checkbox" id="hot"><span>🔥 Température chaude</span></label>
<label class="cc" data-k="cold"><input type="checkbox" id="cold"><span>❄️ Température froide</span></label>

const UI_ORIGINAL_TEXT=new WeakMap(),UI_ORIGINAL_ATTR=new WeakMap();
function setUiLanguage(lang){lang=lang==='en'?'en':'fr';try{localStorage.setItem('gb27lang',lang)}catch(e){}document.documentElement.lang=lang;applyUiTranslations()}
function replacePhrases(text,lang){let out=text;if(lang!=='en')return out;const entries=Object.entries(UI_TRANSLATIONS).sort((a,b)=>b[0].length-a[0].length);for(const [fr,en] of entries){if(fr)out=out.split(fr).join(en)}return out}
function applyUiTranslations(){const lang=(()=>{try{return localStorage.getItem('gb27lang')||'fr'}catch(e){return'fr'}})();document.documentElement.lang=lang;const sel=document.getElementById('uiLang');if(sel)sel.value=lang;
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(n=>{if(!UI_ORIGINAL_TEXT.has(n))UI_ORIGINAL_TEXT.set(n,n.nodeValue);const original=UI_ORIGINAL_TEXT.get(n),translated=replacePhrases(original,lang);if(n.nodeValue!==translated)n.nodeValue=translated});
 document.querySelectorAll('input,textarea,button,[aria-label],[title]').forEach(el=>{let map=UI_ORIGINAL_ATTR.get(el);if(!map){map={};UI_ORIGINAL_ATTR.set(el,map)};['placeholder','aria-label','title','value'].forEach(a=>{if(!el.hasAttribute(a))return;if(!(a in map))map[a]=el.getAttribute(a);const original=map[a];if(a==='value'&&el.tagName==='INPUT'&&['text','number','time','date','password'].includes(el.type))return;const v=replacePhrases(original,lang);if(el.getAttribute(a)!==v)el.setAttribute(a,v)})});}
try{if(!localStorage.getItem('gb27lang'))localStorage.setItem('gb27lang','fr')}catch(e){}
let uiTranslationBusy=false;const uiLangObserver=new MutationObserver(()=>{if(uiTranslationBusy)return;uiTranslationBusy=true;try{applyUiTranslations()}finally{uiTranslationBusy=false}});

 for(let i=-42;i<=7;i++){const d=new Date(s0);d.setDate(s0.getDate()+i);const t=T(iso(d)),c0=c,a0=a;c+=(t-c)/42;a+=(t-a)/7;o.push({i,t,c,a,s:c0-a0})}
 const z=o.find(x=>x.i==0),mx=Math.max(10,...o.map(x=>Math.max(x.c,x.a))),X=i=>10+(i+42)/49*300,Y=v=>120-v/mx*110,ln=(k,col)=>`<polyline fill='none' stroke='${col}' stroke-width='2.5' points='${o.map(x=>X(x.i).toFixed(1)+','+Y(x[k]).toFixed(1)).join(' ')}'/>`;

 const tips=[],ffm=P.kg*(PROF.bf?1-PROF.bf/100:.85),ea=(P.tgt.kcal-(P.EE-P.NE))/ffm,tm1=o.find(x=>x.i==1).t;

function sessionList(d){

 const hasSavedList=Object.prototype.hasOwnProperty.call(SESSIONS,d)&&Array.isArray(SESSIONS[d]);
 if(!hasSavedList){
   SESSIONS[d]=[];
   if(PLANS[d] && Number(PLANS[d].dur||0)>0){
     SESSIONS[d].push({id:'legacy_'+d,cfg:Object.assign({},DEF,PLANS[d]),legacy:true});
   }

 }
 return SESSIONS[d];
}

function deleteSession(d,id){
 try{
   const list=sessionList(d),before=list.length;
   SESSIONS[d]=list.filter(x=>String(x.id)!==String(id));
   if(SESSIONS[d].length===before){toast("Entraînement introuvable");chooseSession(d);return;}
   if(!SESSIONS[d].length){PLANS[d]=Object.assign({},DEF);if(ACTIVE_SESSION_ID===id)ACTIVE_SESSION_ID=null;}
   localStorage.setItem('gb27sessions',JSON.stringify(SESSIONS));
   localStorage.setItem('gb27plans',JSON.stringify(PLANS));
   render();chooseSession(d);toast('Entraînement supprimé ✓');
 }catch(e){console.error(e);toast('Suppression impossible : stockage indisponible')}
}
